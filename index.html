
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Symptom Tracker</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Verdana, sans-serif; }

body {
  background: linear-gradient(135deg, #0ea5e9 0%, #14b8a6 50%, #22c55e 100%);
  background-attachment: fixed;
  color: #1e293b;
  padding: 20px;
  display: flex;
  justify-content: center;
  min-height: 100vh;
}

.container {
  width: 100%;
  max-width: 500px;
  background: #ffffff;
  padding: 0 0 30px;
  border-radius: 20px;
  box-shadow: 0 20px 40px rgba(3, 105, 161, 0.25);
  align-self: flex-start;
  margin-top: 30px;
  overflow: hidden;
}

h1 {
  font-size: 26px;
  color: #ffffff;
  text-align: center;
  padding: 28px 20px 8px;
  background: linear-gradient(135deg, #0284c7, #10b981);
  letter-spacing: 0.5px;
}
h1::before { content: "🩺 "; }

p.sub {
  text-align: center;
  color: #e0f2fe;
  font-size: 14px;
  padding: 0 20px 22px;
  margin-bottom: 25px;
  background: linear-gradient(135deg, #0284c7, #10b981);
}

.input-group, h2, ul, .error, .empty { margin-left: 25px; margin-right: 25px; }

h2 {
  font-size: 18px;
  color: #0369a1;
  margin-bottom: 14px;
  padding-bottom: 8px;
  border-bottom: 3px solid #bbf7d0;
}

.input-group { display: flex; gap: 10px; margin-bottom: 25px; }

input[type="text"] {
  flex: 1;
  min-width: 0;
  padding: 13px 16px;
  border: 2px solid #bae6fd;
  border-radius: 12px;
  font-size: 15px;
  outline: none;
  background: #f0f9ff;
  transition: all 0.2s;
}
input[type="text"]:focus {
  border-color: #10b981;
  background: #ffffff;
  box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.2);
}

button { border: none; color: #fff; cursor: pointer; border-radius: 10px; transition: transform 0.15s, box-shadow 0.15s; }
button:hover { transform: translateY(-2px); box-shadow: 0 6px 14px rgba(0, 0, 0, 0.18); }
button:active { transform: translateY(0); }

.save-btn {
  background: linear-gradient(135deg, #0ea5e9, #10b981);
  padding: 13px 22px;
  font-size: 15px;
  font-weight: 700;
}

ul { list-style: none; }

li {
  background: linear-gradient(135deg, #f0f9ff, #f0fdf4);
  padding: 14px 16px;
  margin-bottom: 12px;
  border-radius: 12px;
  border-left: 5px solid #10b981;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  font-size: 15px;
  box-shadow: 0 2px 8px rgba(14, 165, 233, 0.12);
}
li:nth-child(even) { border-left-color: #0ea5e9; }
li span { flex: 1; word-break: break-word; font-weight: 500; }

.edit-btn { background: #0ea5e9; padding: 7px 13px; font-size: 13px; }
.del-btn  { background: #f43f5e; padding: 7px 13px; font-size: 13px; }

.empty { text-align: center; font-size: 14px; color: #64748b; padding: 20px; background: #f0fdf4; border-radius: 12px; }
.error { text-align: center; font-size: 14px; color: #be123c; background: #ffe4e6; padding: 10px; border-radius: 10px; margin-bottom: 14px; }
</style>
</head>
<body>
<div class="container">
  <h1>Symptom Tracker</h1>
  <p class="sub">Enter a symptom and save it.</p>

  <div class="input-group">
    <input type="text" id="symptomInput" placeholder="Enter a symptom">
    <button class="save-btn" id="saveBtn">Save</button>
  </div>

  <div id="errorBox" class="error" style="display:none"></div>

  <h2>Saved Symptoms</h2>
  <ul id="symptomList"></ul>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
  import {
    getFirestore, collection, addDoc, getDocs, deleteDoc, updateDoc, doc, query, orderBy
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDhQZQrzex4mZ1JNmCp9YBluGevtPQnR5Y",
    authDomain: "symptom-checklist.firebaseapp.com",
    projectId: "symptom-checklist",
    storageBucket: "symptom-checklist.firebasestorage.app",
    messagingSenderId: "70372218409",
    appId: "1:70372218409:web:f208770a6ab493ee2feea8"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const input = document.getElementById("symptomInput");
  const list = document.getElementById("symptomList");
  const errorBox = document.getElementById("errorBox");

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.style.display = msg ? "block" : "none";
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  async function loadSymptoms() {
    try {
      showError("");
      const q = query(collection(db, "symptoms"), orderBy("createdAt", "desc"));
      const snap = await getDocs(q);
      if (snap.empty) {
        list.innerHTML = '<p class="empty">No symptoms saved yet.</p>';
        return;
      }
      list.innerHTML = snap.docs.map(d => `
        <li data-id="${d.id}">
          <span>${escapeHtml(d.data().symptom || "")}</span>
          <button class="edit-btn" data-action="edit">Edit</button>
          <button class="del-btn" data-action="delete">Delete</button>
        </li>`).join("");
    } catch (err) {
      console.error(err);
      showError("Could not load symptoms: " + err.message);
    }
  }

  async function saveSymptom() {
    const text = input.value.trim();
    if (!text) { alert("Please enter a symptom"); return; }
    try {
      showError("");
      await addDoc(collection(db, "symptoms"), { symptom: text, createdAt: new Date().toISOString() });
      input.value = "";
      await loadSymptoms();
    } catch (err) {
      console.error(err);
      showError("Could not save: " + err.message);
    }
  }

  list.addEventListener("click", async (e) => {
    const btn = e.target.closest("button");
    if (!btn) return;
    const li = btn.closest("li");
    const id = li.dataset.id;
    try {
      if (btn.dataset.action === "delete") {
        await deleteDoc(doc(db, "symptoms", id));
      } else if (btn.dataset.action === "edit") {
        const current = li.querySelector("span").textContent;
        const updated = prompt("Edit symptom:", current);
        if (updated === null || updated.trim() === "") return;
        await updateDoc(doc(db, "symptoms", id), { symptom: updated.trim() });
      }
      await loadSymptoms();
    } catch (err) {
      console.error(err);
      showError("Action failed: " + err.message);
    }
  });

  document.getElementById("saveBtn").addEventListener("click", saveSymptom);
  input.addEventListener("keydown", e => { if (e.key === "Enter") saveSymptom(); });

  loadSymptoms();
</script>
</body>
</html>
